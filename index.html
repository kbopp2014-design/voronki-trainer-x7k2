<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Воронки входа, перевода и выхода сотрудников</title>
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#F8F5F4;--card:#FFFFFF;--ink:#262626;--mut:#4D4D4D;--rule:#E6DDD0;--acc:#C41700;--acc-t:#FFF0D2;--amber:#F09A00;--ok:#2F6B47;--ok-t:#E3F0E7;--bad:#7A1F1F;--bad-t:#F6E3E1;
--serif:"Golos Text",system-ui,sans-serif;--sans:"Golos Text",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans)}
main{max-width:54rem;margin:0 auto;padding:1.5rem 1.1rem 4rem}
h1,h2,.q{font-family:var(--serif);font-weight:600;line-height:1.3}
h1{font-size:1.9rem;margin:2rem 0 .6rem}h2{font-size:1.3rem;margin:1.6rem 0 .6rem}
.q{font-size:1.2rem;line-height:1.5;margin:.8rem 0 1.1rem}
.mut{color:var(--mut)}.bar{height:3px;background:var(--rule);margin:.5rem 0 0}.bar i{display:block;height:100%;background:var(--acc)}
.topic{color:var(--acc);font-weight:500;font-size:.9rem}
button{font:inherit;color:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;margin:.5rem 0;padding:.8rem 1rem;background:var(--card);border:1px solid var(--rule);border-radius:6px}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-t);border-color:var(--ok)}.opt.bad{background:var(--bad-t);border-color:var(--bad)}
.opt.sel{background:var(--acc-t);border-color:var(--acc)}
.fb{margin:1.2rem 0;padding:.2rem 0 .2rem 1rem;border-left:3px solid var(--acc)}.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.fb b{display:block;margin-bottom:.2rem}
.btn{padding:.75rem 1.4rem;background:var(--acc);color:var(--bg);border:0;border-radius:6px;font-weight:600}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0 1.4rem}
.chip{padding:.4rem .85rem;border:1px solid var(--rule);border-radius:99px;background:var(--card)}.chip[aria-pressed=true]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;gap:1rem}
table{width:100%;border-collapse:collapse;margin:.5rem 0}td{padding:.5rem 0;border-bottom:1px solid var(--rule)}td:last-child{text-align:right}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
#nav div{max-width:54rem;margin:0 auto;display:flex;gap:.25rem;padding:.4rem 1.1rem}
#nav button{background:none;border:0;padding:.55rem .9rem;border-radius:6px;font-weight:500;color:var(--mut)}
@media (max-width:430px){#nav button{padding:.55rem .55rem}#nav div{padding-left:.7rem;padding-right:.7rem}}
#nav button[aria-current=true]{background:var(--acc-t);color:var(--acc)}
details.part{border-top:1px solid var(--rule);padding:.3rem 0 1.2rem}
details.part summary{cursor:pointer;list-style:none;display:flex;gap:1rem;align-items:baseline;padding:.8rem 0}
details.part summary::-webkit-details-marker{display:none}
.num{font:600 2rem/1 var(--serif);color:var(--acc);min-width:2.2rem}.ptitle{font:600 1.25rem/1.3 var(--serif)}
.idea{margin:.2rem 0 1.2rem;padding-left:1rem;border-left:3px solid var(--acc);font:400 1.05rem/1.55 var(--serif)}
.blk{margin:1.1rem 0}.blk h3{margin:0 0 .2rem;font-size:1rem}.blk h3 span{color:var(--acc);margin-right:.5rem}.blk p{margin:0}
.chk{margin-top:.8rem}.gist{margin:.2rem 0 .5rem;padding:.5rem .8rem;background:var(--acc-t);border-radius:6px}.full{margin:.6rem 0 0;max-width:80ch;font-family:var(--serif);line-height:1.7}.tag{margin-left:auto;font-size:.8rem;color:var(--ok)}
html{color-scheme:light}

main{background:#fff;border-radius:14px;margin:1rem auto 2rem;box-shadow:0 2px 24px rgba(0,0,0,.14)}
#nav{background:#F8F5F4;border-top:4px solid var(--amber)}
.brand{margin-right:auto;padding:.55rem 0;font-weight:600;color:var(--mut);letter-spacing:.02em}
.bar i{background:var(--amber)}.topic,.num{color:var(--acc)}.chip[aria-pressed=true]{background:var(--acc)}
.num{font-weight:600}.hint{margin:.4rem 0 0;padding:.5rem .8rem;background:#FFF4D6;border-left:4px solid var(--amber);border-radius:6px;font-size:.92rem}.case{background:var(--acc-t);border-left:4px solid var(--amber);padding:.8rem 1rem;border-radius:6px;margin:.8rem 0 1.2rem}.fld{margin:.9rem 0}.fld label{display:block;font-weight:500;margin-bottom:.25rem}.fld select,.fld input[type=text]{width:100%;padding:.6rem .7rem;border:1px solid var(--rule);border-radius:6px;font:inherit;background:#fff;color:var(--ink)}.cbs{display:flex;flex-wrap:wrap;gap:.4rem 1rem}.cbs label{font-weight:400;display:flex;gap:.35rem;align-items:center}.logo{height:34px;width:auto;margin:.15rem auto .15rem 0}.logo-lg{height:84px;width:auto;display:block;margin:.6rem 0 .2rem}.full{white-space:pre-line}h1,h2{font-weight:600}
.rd p{margin:.6rem 0;max-width:80ch;line-height:1.7}.rd ul,.rd ol{margin:.4rem 0 .9rem;padding-left:1.4rem;max-width:80ch}.rd li{margin:.35rem 0;line-height:1.6}.rd li::marker{color:var(--acc)}.rd b.lb{color:var(--ink)}
.rd .warn{background:#FFF4D6;border-left:4px solid var(--amber);padding:.55rem .85rem;border-radius:6px}
.rd ul.cl{list-style:none;padding-left:0}.rd ul.cl li{position:relative;padding-left:1.7rem}.rd ul.cl li:before{content:"☐";position:absolute;left:0;color:var(--acc);font-size:1.1em}
.idea.rd p:first-child{margin-top:0}.idea.rd p:last-child{margin-bottom:0}
.blk{margin:1.6rem 0;padding-top:1.1rem;border-top:1px solid var(--rule)}.blk h3{font:600 1.1rem/1.35 var(--serif);margin:0 0 .5rem}
.gist{margin:1rem 0 .4rem;border-left:4px solid var(--acc)}
.train{margin:0 0 1.1rem;padding:.8rem 1rem;background:#FFF0D2;border:2px solid var(--amber);border-radius:10px}.train b{display:block;font-size:1.05rem;color:var(--acc)}.train p{margin:.25rem 0 0}
.lk{background:#fff;border:1px solid var(--rule);border-top:5px solid var(--acc);border-radius:14px;padding:1rem 1.2rem 1.2rem;margin:1.2rem 0}.lk h2{margin:.2rem 0 .8rem}
.lkb{display:flex;flex-wrap:wrap;gap:1.2rem;align-items:center}.qr{flex:none;width:200px;text-align:center;margin:0 auto}.qr img,.qrph{margin:0 auto}.qr img,.qrph{display:block;width:180px;height:180px}.qrph{display:grid;place-items:center;border:2px dashed var(--rule);border-radius:10px;color:var(--mut);font-size:.85rem;padding:.7rem}
.qrc{font-weight:600;margin:.45rem 0 0;font-size:.95rem}.lkt{flex:1;min-width:210px}.lkt p{margin:.3rem 0 .8rem}
a.btn{display:inline-block;text-decoration:none}.btn.dis{display:inline-block;background:#E4DDD4;color:#6b6b6b;cursor:default}.lkt .url{word-break:break-all;font-size:.85rem;color:var(--mut);margin:.6rem 0 0}
@media (max-width:430px){#nav button{font-size:.86rem}#nav .logo{display:none}#nav div{gap:0;justify-content:space-between}}

<script>
const Q=[{t:"Вход",q:"Новичок вышел на работу в понедельник, а воронка «Вход сотрудника» не создана. Что делаешь?",o:["Жду пятницы, чтобы собрать все документы", "Создаю сразу, дату запуска привязываю к фактическому началу процесса", "Прошу новичка создать воронку самому", "Жду напоминания от HR"],a:1,e:"Воронку создаёт руководитель, и делает это вовремя, а не задним числом. Откладывать создание на несколько дней после фактического выхода нельзя: от неё зависят доступы, обучение и адаптация."},
{t:"Вход",q:"Нужной должности нет в классификаторе. Что делать?",o:["Придумать похожее название", "Выбрать самую близкую по смыслу", "Обратиться к директору по персоналу или методисту HR-сервиса", "Оставить поле пустым"],a:2,e:"Должность выбирают только из утверждённого классификатора, ведь каждая должность определяет доступы и обучение. Если нужной нет, обращаются к директору по персоналу или методисту HR-сервиса."},
{t:"Вход",q:"Ты загрузил паспорт сотрудника одним разворотом: с фото и данными. Этого достаточно?",o:["Да, остальное необязательно", "Нет: нужны два разворота, с фото и данными и со сведениями о регистрации, оба читаемые", "Нужен только разворот с регистрацией", "Достаточно любого фото паспорта"],a:1,e:"Прикладывают два разворота: с фотографией и персональными данными и со сведениями о регистрации. Они должны быть полностью видны, читаемы, без обрезанных страниц и загружены в свои поля."},
{t:"Вход",q:"Принимаешь водителя, который работает у ИП-перевозчика. Что нужно приложить?",o:["Только паспорт водителя", "Данные перевозчика, паспорт перевозчика, водительское удостоверение и документ водителя вместо анкеты", "Обычную анкету и трудовой договор с ТК", "Ничего: ИП оформит всё сам"],a:1,e:"Для «Водителя от ИП перевозчика» нужны данные и паспорт перевозчика, ВУ водителя и документ водителя вместо анкеты. Трудовые отношения оформляются с ИП, а вход нужен для проверки, обучения и доступа к ПО."},
{t:"Вход",type:"order",q:"Расставь шаги по оформлению «Акта приёма-передачи ТМЦ» по порядку: нажимай по очереди.",items:["Скачать акт и прикрепить его в задачу воронки", "Распечатать и подписать акт", "Сфотографировать подписанный акт", "Добавить фото в задачу воронки", "Отправить оригинал в УК, в отдел снабжения"],e:"Акт подтверждает передачу ценностей в личное пользование и под материальную ответственность. Он составляется в двух экземплярах: один идёт в отдел снабжения, второй остаётся у получателя."},
{t:"Выход",q:"Сотрудник написал заявление об увольнении сегодня, последний рабочий день через две недели. Когда создавать воронку «Выход»?",o:["Сегодня, в день подачи заявления", "За неделю до ухода", "В последний рабочий день", "После фактического увольнения"],a:0,e:"Воронка создаётся в день подачи заявления и никогда не задним числом. Это нужно, чтобы вовремя запустились все задачи по выходу и «Обходной лист»."},
{t:"Выход",q:"Увольняющийся говорит: «Давайте я сам заполню воронку выхода, мне не сложно». Что делаешь?",o:["Соглашаюсь, так быстрее", "Отказываю: форму заполняет только руководитель", "Разрешаю, если сам занят", "Передаю форму HR"],a:1,e:"Форму выхода заполняет только руководитель сотрудника. Просить увольняющегося заполнить воронку за руководителя нельзя."},
{t:"Выход",q:"Сотрудник устно сообщил, что уходит, но заявления нет. Запускаешь воронку «Выход»?",o:["Нет: сначала заявление, затем воронка", "Да, чтобы не терять время", "Да, но без даты увольнения", "Да, а заявление принесут позже"],a:0,e:"Без заявления воронку не запускают. Простое правило: сначала заявление, затем воронка «Выход». Заявление должно относиться к этому сотруднику, быть прикреплено, читаемым и содержать нужные сведения."},
{t:"Выход",q:"Как правильно указать в форме выхода своё имя как заполняющего?",o:["Иванов", "Иванов И.", "Иванов Иван", "И. Иванов"],a:2,e:"Указывают фамилию и имя полностью, без инициалов и без одной фамилии: «Иванов Иван». Неправильно: «Иванов» или «Иванов И.»."},
{t:"Выход",q:"После отправки воронки «Выход» создано 8 задач «Обходного листа». Кто закрывает эти задачи?",o:["Постановщик воронки", "Ответственный по каждой задаче: выполняет, отмечает чек-лист, оставляет комментарий и закрывает", "Увольняющийся сотрудник", "Директор по персоналу"],a:1,e:"Постановщик воронки задачи сам не закрывает. После выполнения всех частей формируется «Обходной лист», его можно посмотреть и скачать из отдельной задачи."},
{t:"Выход",q:"У увольняющегося нет рабочей почты. Что делаешь с полем «Рабочая почта и пароль»?",o:["Выдумываю адрес", "Не заполняю: поле нужно только при наличии почты", "Пишу «нет» в каждое поле формы", "Не отправляю воронку"],a:1,e:"Рабочая почта и рабочий телефон заполняются при наличии. Если их нет, поля можно не заполнять. А поля со звёздочкой пустыми оставлять нельзя."},

{t:"Перевод",q:"Когда возможен перевод сотрудника на другую должность?",o:["Если есть свободная штатная единица или перевод согласован с дивизионным директором", "Если сотрудник сам попросил", "Если руководитель так решил", "Всегда"],a:0,e:"Перевод на новую должность возможен при свободной штатной единице либо при согласовании с дивизионным директором."},

const C=[["Вход сотрудника", "Воронку «Вход» создаёт руководитель сотрудника, вовремя и без пропусков: от неё зависят доступы, обучение и адаптация.", ["Вход"], [["1.1", "Когда и кто", "Руководитель создаёт воронку вовремя, не задним числом: дата запуска соответствует фактическому началу процесса. Заранее подготовь данные и распечатай анкету новичка и бланк акта."], ["1.2", "Данные сотрудника", "ФИО полностью (иначе будут задержки), город, филиал или подразделение, должность, телефон, даты. Должность только из классификатора; нет нужной — обратись к директору по персоналу или методисту HR-сервиса. Несколько должностей можно указать через запятую."], ["1.3", "Тип трудоустройства", "«Да» — официально; «Нет» — без оформления; «Водитель от ИП перевозчика» — нужны данные и паспорт перевозчика, ВУ водителя и документ водителя вместо анкеты. Трудовые отношения оформляются с ИП, а не с ТК."], ["1.4", "Документы", "Паспорт с двумя разворотами: фото и данные, регистрация. Для водителя ещё ВУ. Всё должно быть полностью видно, читаемо, без обрезанных страниц и в нужных полях."], ["1.5", "Анкета и дополнительные данные", "Анкету заполни и прикрепи до отправки. Заполни поля со звёздочкой: рекомендация («Приведи друга»), рабочее место, подразделение, наставник. Если поле не относится к сотруднику, выбери предусмотренный вариант, а не оставляй пустым."], ["1.6", "Доступы и оборудование", "Выбирай только нужное: Битрикс, ПО Луч-2, почта, SIM-карта, ГУП-аккаунт, оргтехника, доступ в офис, валидация, другое или «ничего не нужно». Валидация подтверждает подлинность паспортных данных клиента в личном кабинете."], ["1.7", "Акт приёма-передачи ТМЦ", "Скачай и прикрепи акт в задачу, распечатай и подпиши, сфотографируй, добавь фото в задачу и отправь оригинал в УК, в отдел снабжения. Акт составляется в двух экземплярах."], ["1.8", "Чек-лист перед отправкой", "ФИО, город, подразделение, должность из классификатора, тип трудоустройства, воронка не задним числом, паспорт и ВУ, анкета, наставник, доступы, акт ТМЦ с фото и оригиналом."]]], ["Перевод сотрудника", "Должность сотрудника и его доступы должны соответствовать друг другу.", ["Перевод"], [["2.1", "Воронка «Перевод»", "Нужна при переводе на другую должность или в другое подразделение. Укажи ФИО, текущие должность и подразделение, новые подразделение и должность, дату перевода, заявление (если требуется) и доступы."], ["2.2", "Когда перевод возможен", "Если есть свободная штатная единица или перевод согласован с дивизионным директором."], ["2.3", "Чужие доступы", "Если запрашивают доступы другой должности, просто добавить их нельзя. Нужно либо оформить перевод, либо, если сотрудник остаётся на месте, указать основание и приложить согласование."]]], ["Выход сотрудника", "Воронка «Выход» запускается в день подачи заявления: от этого зависит, вовремя ли пройдёт «Обходной лист».", ["Выход"], [["3.1", "Когда создавать", "В день подачи заявления. Не в последний рабочий день и не после фактического увольнения."], ["3.2", "Кто заполняет", "Только руководитель сотрудника. Просить самого увольняющегося заполнить форму нельзя."], ["3.3", "Заявление", "Обязательно прикрепи заявление. Без него воронку не запускают. Проверь, что оно относится к этому сотруднику, читаемо и содержит нужные сведения. Правило: сначала заявление, затем воронка."], ["3.4", "Поля формы", "Фамилия и имя заполняющего без инициалов («Иванов Иван»), подразделение, кто увольняется, ФИО полностью, тип трудоустройства, дата приёма, город, отдел, должность из классификатора, дата увольнения по заявлению, фактическая причина, рекомендация и наличие рабочего компьютера."], ["3.5", "Почта, телефон, рекомендация и компьютер", "Рабочая почта, телефон и пароли заполняются при наличии. Если их нет, поля можно не заполнять."], ["3.6", "После отправки", "Создаётся 8 задач «Обходного листа», у каждой свой ответственный. Постановщик воронки их не закрывает: ответственные выполняют, отмечают чек-лист, оставляют комментарий и закрывают сами. Готовый «Обходной лист» можно скачать из отдельной задачи."]]]];

i1:`Воронку «Вход сотрудника» заполняет руководитель сотрудника.

❗ Воронку необходимо создавать своевременно — не задним числом. Дата запуска воронки должна соответствовать фактическому началу процесса входа сотрудника. Не откладываем создание воронки на несколько дней после фактического выхода.

Подготовьтесь: соберите информацию, необходимую для п. 2–5, распечатайте анкету новичка (при приёме) и бланк акта (при приёме, переводе, увольнении), а также заявление на перевод сотрудника (при переводе)!

Форма открывается двумя способами: по ссылке или через QR-код.`,
"1.1":`Открываем форму «Вход сотрудника» и начинаем заполнение.

Поля, отмеченные красной звёздочкой (*), обязательны для заполнения. Не оставляем обязательные поля пустыми.`,
"1.2":`Указываем:
— ФИО сотрудника — полностью, без полного указания имени будут задержки с проведением воронки и сопутствующих задач;
— город, где работает сотрудник;
— филиал / подразделение;
— должность;
— номер телефона;
— необходимые даты;
— другие поля, обязательные к заполнению.

Важно! Каждая должность — это определённые доступы и процессы обучения, адаптации, доступов и т. п.

Должность выбираем только из утверждённого классификатора. Не придумываем название должности самостоятельно. Если нужной должности нет в списке — обращаемся к директору по персоналу или методисту HR-сервиса. Если сотрудник занимает несколько должностей — это допустимо указать через запятую.`,
"1.3":`В поле «Официальное трудоустройство?» обязательно выбираем подходящий вариант:
«Да» — сотрудник официально трудоустраивается в компанию;
«Нет» — сотрудник не оформляется официально;
«Водитель от ИП перевозчика» — водитель работает у ИП-перевозчика.

Если выбран «Водитель от ИП перевозчика», в этом случае:
— указываем данные перевозчика;
— прикладываем паспорт перевозчика;
— прикладываем водительское удостоверение водителя;
— вместо анкеты при приёме прикладываем документ водителя, работающего у ИП-перевозчика.

Такой вход используется для проверки, обучения и предоставления необходимого доступа к программному обеспечению. Трудовые отношения оформляются с ИП-перевозчиком, а не с ТК «ЛУЧ».`,
"1.4":`Это один из самых важных этапов.

Паспорт. Обязательно прикладываем паспорт с двумя нужными разворотами:
— разворот с фотографией и персональными данными;
— разворот со сведениями о регистрации.

❗ Проверьте перед отправкой, документы должны быть: полностью видны; читаемы; без обрезанных страниц; загружены в соответствующие поля.

Водитель. Если сотрудник принимается на должность водителя, обязательно прикладываем водительское удостоверение.`,
"1.5":`Анкету необходимо заполнить и прикрепить до отправки воронки.

❗ Не оставляем поле анкеты пустым, если для данного типа трудоустройства анкета предусмотрена. Проверяем, что анкета относится именно к этому сотруднику и заполнена корректно.

Для водителя от ИП-перевозчика. Вместо обычной анкеты при приёме прикладывается документ водителя, работающего у ИП-перевозчика.

Указываем дополнительные данные. Заполняем обязательные поля, отмеченные красной звёздочкой (*):
— данные о рекомендации, если сотрудник пришёл по программе «Приведи друга»;
— необходимость рабочего места;
— подразделение;
— наставника;
— другие обязательные поля формы.

Если поле к сотруднику не относится — выбираем соответствующий вариант, предусмотренный формой, а не оставляем обязательное поле пустым.`,
"1.6":`Выбираем только то, что действительно необходимо сотруднику для работы:
Битрикс; ПО Луч-2; почта; SIM-карта; ГУП-аккаунт; оргтехника; доступ в офис; валидация; другое; либо «ничего не нужно».

*Валидация — процесс подтверждения подлинности паспортных данных клиента, которые он ввёл в личный кабинет ТК «ЛУЧ».`,
"1.7":`Если сотруднику передаются товарно-материальные ценности, оборудование или иное имущество, Акт приёма-передачи ТМЦ должен быть оформлен в рамках процесса.

Правильное название документа: «Акт приёма-передачи товарно-материальных ценностей».

Порядок действий:
1. Скачать Акт и прикрепить его в задачу воронки.
2. Распечатать и подписать Акт.
3. Сделать фото подписанного Акта.
4. Добавить фото подписанного Акта обратно в задачу воронки по предоставлению необходимого оборудования и доступов (в этой задаче руководитель отдела снабжения и инициатор воронки).
5. Оригинал подписанного Акта отправить вместе с документами в УК, в Отдел снабжения.

Акт подтверждает передачу ТМЦ сотруднику в личное пользование и под материальную ответственность. Документ предусматривает два экземпляра: один передаётся в Отдел снабжения, второй остаётся у получателя ТМЦ.`,
"1.8":`Перед нажатием «Отправить» пройдитесь по короткому чек-листу:
☐ ФИО указано правильно.
☐ Город и подразделение указаны правильно.
☐ Выбрана правильная должность из классификатора.
☐ Верно выбран филиал и подразделение.
☐ Выбран правильный тип трудоустройства.
☐ Воронка создана не задним числом.
☐ Паспорт загружен — два нужных разворота.
☐ Для водителя загружено водительское удостоверение.
☐ Анкета заполнена и приложена, если она предусмотрена.
☐ Указан наставник.
☐ Выбраны необходимые доступы.
☐ Акт приёма-передачи ТМЦ оформлен, если сотруднику передаются ТМЦ.
☐ Фото подписанного Акта добавлено в задачу.
☐ Оригинал Акта подготовлен для отправки в УК, в Отдел снабжения.`,
s1:`Главное правило. Лучше потратить несколько минут на проверку формы до отправки, чем потом возвращать воронку на исправление. Если все обязательные поля заполнены, документы приложены правильно, а даты и данные соответствуют фактической ситуации — воронку можно отправлять на проверку.`,
i3:`Выход сотрудника из компании — это процесс прекращения трудовых отношений между работником и работодателем. Этот процесс включает в себя формальные процедуры, такие как подача заявления об увольнении, заполнение «Обходного листа» и завершение всех обязательств сторон, что позволяет обеспечить законность и прозрачность процесса, а также минимизировать возможные конфликты и недоразумения.

Подготовьтесь: соберите информацию, необходимую для п. 2–5, и распечатайте заявление на увольнение и бланк акта (при приёме, переводе, увольнении)!

Форма открывается двумя способами: по ссылке или через QR-код.`,
"3.1":`Воронка «Выход сотрудника из компании» создаётся в день подачи сотрудником заявления на увольнение.

❗ Не создаём воронку задним числом.

Если сотрудник написал заявление сегодня — воронку необходимо создать сегодня, а не в последний рабочий день и не после фактического увольнения.

Это важно для своевременного запуска всех задач по выходу сотрудника и прохождения «Обходного листа».`,
"3.2":`Форму заполняет только руководитель сотрудника.

Не нужно просить самого увольняющегося сотрудника заполнять воронку за руководителя.`,
"3.3":`В это поле необходимо прикрепить заявление сотрудника об увольнении.

❗ Без заявления воронку не запускаем.

Перед отправкой проверьте:
— заявление действительно относится к этому сотруднику;
— документ прикреплён к форме;
— заявление читаемое;
— в заявлении есть необходимая информация для оформления увольнения.

Простое правило: сначала заявление → затем воронка «Выход».

Сам процесс выхода предусматривает подачу заявления об увольнении и дальнейшее прохождение «Обходного листа».`,
"3.4":`Поля, отмеченные красной *, обязательны к заполнению. Если поле отмечено * — его нельзя оставлять пустым.

Фамилия, имя заполняющего форму *. Указываем фамилию и имя руководителя, который создаёт воронку.
❗ Не указываем только фамилию и не используем инициалы.
Правильно: Иванов Иван. Неправильно: Иванов / Иванов И.

Подразделение *. Выбираем подразделение, к которому относится увольняющийся сотрудник (из предлагаемого списка).

Кто увольняется? * Выбираем подходящий вариант:
Сотрудник склад/офис — если увольняется менеджер, грузчик, водитель, кладовщик и т. д.
Руководитель — если увольняется руководитель филиала, руководитель отдела и т. п.

ФИО увольняющегося сотрудника *. Указываем полностью фамилию и имя сотрудника, который увольняется.

Тип трудоустройства *. Выбираем фактический тип трудоустройства сотрудника (из предлагаемого списка).

Дата приёма на работу *. Указываем дату, когда сотрудник был принят на работу.

Город *. Указываем город, из которого сотрудник выходит из компании.

Отдел *. Выбираем соответствующий отдел (из предлагаемого списка).

Должность. Указываем должность увольняющегося сотрудника. При выборе должности используем утверждённое наименование должности из классификатора (выбирать из предлагаемого списка), а не придумываем название самостоятельно.

Дата увольнения *. Указываем планируемую дату увольнения сотрудника.
❗ Дата должна соответствовать заявлению и оформляемому увольнению.

Причина увольнения *. Указываем фактическую причину увольнения.`,
"3.5":`Рабочая почта и пароль. Заполняем при наличии. Если рабочей почты у сотрудника нет — поле можно не заполнять.

Рабочий телефон и пароль. Заполняем при наличии. Если рабочего телефона нет — поле можно не заполнять.

Рекомендация *. Указываем рекомендацию по сотруднику. Это необходимо для того, чтобы сотрудник отдела подбора при необходимости мог предложить увольняющемуся сотруднику другую вакансию.

Есть рабочий компьютер? Отмечаем соответствующий вариант. Это поле помогает определить наличие у сотрудника рабочего оборудования перед его выходом из компании.`,
"3.6":`После отправки формы в Битрикс автоматически создаются задачи, связанные с прохождением «Обходного листа». По процессу создаётся 8 задач. В каждой задаче указан ответственный сотрудник, который должен выполнить свою часть обходного листа.

Важно! Постановщик воронки не закрывает эти задачи самостоятельно. Ответственный по каждой задаче:
— выполняет необходимые действия;
— отмечает чек-лист;
— оставляет комментарий/результат;
— закрывает задачу после выполнения.

После этого формируется «Обходной лист», который можно посмотреть и скачать из отдельной задачи.`,
s3:`Короткая проверка перед отправкой. Перед нажатием «Отправить» проверьте:
☐ Воронка создана в день подачи заявления, не задним числом.
☐ Указаны фамилия и имя заполняющего форму.
☐ Выбрано подразделение.
☐ Выбрано, кто увольняется.
☐ Указано полное ФИО увольняющегося.
☐ Прикреплено заявление об увольнении.
☐ Указан тип трудоустройства.
☐ Указана дата приёма.
☐ Указан город.
☐ Указан отдел.
☐ Указана должность.
☐ Указана дата увольнения.
☐ Указана причина увольнения.
☐ Заполнена рекомендация.
☐ При наличии указаны рабочая почта и телефон.
☐ Указано наличие рабочего компьютера.

Главное. Заявление есть → воронка создана в день подачи заявления → обязательные поля заполнены → данные проверены → нажимаем «Отправить». Так процесс выхода запускается вовремя, и дальше необходимые участники получают свои задачи по «Обходному листу».`,
"2.1":`Если сотрудника необходимо перевести на другую должность или в другое подразделение, необходимо оформить в Битрикс воронку «Перевод сотрудника».

При заполнении указываем:
— ФИО сотрудника;
— текущую должность и подразделение;
— новое подразделение;
— новую должность;
— дату перевода;
— заявление на перевод — если требуется;
— необходимые доступы.`,
"2.2":`Перевод на новую должность возможен, если:
— либо на эту должность есть свободная штатная единица;
или
— либо перевод согласован с дивизионным директором.`,
"2.3":`Если сотруднику запрашивают доступы, которые относятся к другой должности, просто добавить такие доступы недостаточно. В этом случае необходимо:
— либо оформить перевод сотрудника на соответствующую должность;
— либо, если сотрудник остаётся на своей должности, указать основание для предоставления таких доступов и приложить необходимое согласование.

Простыми словами: должность сотрудника и его доступы должны соответствовать друг другу. Если нужны права другой должности — сначала проверяем основание для перевода или получения этих прав.`
};

function fmt(t){
 const lb=s=>{let m;const b=x=>`<b class="lb">${esc(x[1])}</b> ${esc(x[2])}`;
  if(m=s.match(/^([^.!?—:❗\n]{2,55}?\?(?: \*)?)\s+(\S[\s\S]*)$/))return b(m);
  if(m=s.match(/^([^.!?—:❗\n]{2,55}? \*)\.?\s+(\S[\s\S]*)$/))return b(m);
  if((m=s.match(/^([^.!?—:❗\n]{2,40})\.\s+(\S[\s\S]*)$/))&&m[1].trim().split(/\s+/).length<=4&&!/^(Если|Не|Это|Так|Для|Вместо|Эта|Он|Она)(\s|$)/.test(m[1]))return b(m);
  return esc(s)};
 return String(t).split("\n\n").map(par=>{
  let L=par.split("\n");
  if(L.length>=3&&/:$/.test(L[0])&&L.slice(1).every(x=>!/^(— |☐ |\d+\. |❗)/.test(x)))L=[L[0],...L.slice(1).map(x=>"— "+x)];
  let o="",buf=[],kind="";
  const flush=()=>{if(buf.length){const tag=kind==="ol"?"ol":"ul";o+=`<${tag}${kind==="cl"?' class="cl"':""}>${buf.map(x=>`<li>${x}</li>`).join("")}</${tag}>`;buf=[];kind=""}};
  L.forEach((x,i)=>{let m,k="";
   if(m=x.match(/^— (.*)$/))k="ul";else if(m=x.match(/^☐ (.*)$/))k="cl";else if(m=x.match(/^\d+\. (.*)$/))k="ol";
   if(k){if(kind&&kind!==k)flush();kind=k;buf.push(esc(m[1]));return}
   flush();
   if(x.startsWith("❗"))o+=`<p class="warn">${esc(x.replace(/^❗\s*/,""))}</p>`;
   else o+=`<p>${i===0?lb(x):esc(x)}</p>`;
  });flush();return o}).join("")}

let len=10,S={},topics=["Вход","Перевод","Выход"],pick=new Set(topics);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function home(){setNav("train");
 let best="";try{best=localStorage.getItem("mg_best")||""}catch(e){}
 app.innerHTML=`<h1>Воронки входа, перевода и выхода сотрудников</h1>
 <p class="mut">Рабочие ситуации по заполнению воронок в Битрикс24. После каждого ответа вы увидите правило, а ошибки вернутся в конце для закрепления.</p>
 <h2>Темы</h2><div class="chips">${topics.map(t=>`<button class="chip" aria-pressed="${pick.has(t)}" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>
 <h2>Сколько вопросов</h2><div class="chips">${[10,20,0].map(n=>`<button class="chip" aria-pressed="${len===n}" data-n="${n}">${n||"Все"}</button>`).join("")}</div><button class="btn" id="go" ${pick.size?"":"disabled"}>Начать тренировку</button>${best?`<p class="mut">Лучший результат: ${esc(best)}</p>`:""}`;
 app.querySelectorAll(".chip[data-t]").forEach(b=>b.onclick=()=>{const t=b.dataset.t;pick.has(t)?pick.delete(t):pick.add(t);home()});
 app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{len=+b.dataset.n;home()});
 document.getElementById("go").onclick=start;
}
function start(){if(!U.n&&RESULT_URL)return ask(start);setNav("train");let qs=shuf(Q.filter(x=>pick.has(x.t)));if(len)qs=qs.slice(0,len);S={queue:qs,i:0,total:qs.length,ok:0,by:{},retry:new Set(),chosen:[]};show()}
function show(){
 const q=S.queue[S.i];S.chosen=[];S.done=false;
 const retry=S.retry.has(q)?" (повторение)":"";
 const head=`<div class="row"><span class="topic">${esc(q.t)}${retry}</span><span class="mut">${S.i+1} из ${S.queue.length}</span></div><div class="bar"><i style="width:${S.i/S.queue.length*100}%"></i></div><p class="q">${esc(q.q)}</p>`;
 if(q.type==="order"){S.items=shuf(q.items);drawOrder(head,q)}
 else if(q.type==="multi"){S.sel=new Set();S.ord=shuf(q.o.map((_,k)=>k));drawMulti(head,q)}
 else{app.innerHTML=head+shuf(q.o.map((o,k)=>[o,k])).map(([o,k])=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")+`<div id="fb"></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k===q.a,q,b))}
}
function drawOrder(head,q){
 app.innerHTML=head+S.items.map((it,k)=>{const n=S.chosen.indexOf(k);return `<button class="opt ${n>=0?"sel":""}" data-k="${k}" ${S.done?"disabled":""}>${n>=0?`<b>${n+1}.</b> `:""}${esc(it)}</button>`}).join("")+`<div id="fb"></div><button class="btn ghost" id="rs">Сбросить</button>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(S.chosen.includes(k))return;S.chosen.push(k);
  if(S.chosen.length<S.items.length)return drawOrder(head,q);
  S.done=true;const good=S.chosen.every((k,n)=>S.items[k]===q.items[n]);drawOrder(head,q);fin(good,q)});
 document.getElementById("rs").onclick=()=>{S.chosen=[];S.done=false;drawOrder(head,q)};
}
function drawMulti(head,q,done){
 app.innerHTML=head+`<p class="mut">Выбери все верные варианты.</p>`+S.ord.map(k=>{const o=q.o[k],on=S.sel.has(k),r=q.a.includes(k);return `<button class="opt ${done?(r?"ok":on?"bad":""):(on?"sel":"")}" data-k="${k}" ${done?"disabled":""}>${esc(o)}</button>`}).join("")+`<div id="fb"></div>`+(done?"":`<button class="btn ghost" id="ck">Проверить</button>`);
 if(done)return;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;S.sel.has(k)?S.sel.delete(k):S.sel.add(k);drawMulti(head,q)});
 document.getElementById("ck").onclick=()=>{if(!S.sel.size)return;const good=q.o.every((_,k)=>S.sel.has(k)===q.a.includes(k));drawMulti(head,q,true);fin(good,q)};
}
function answer(good,q,btn){
 app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.k===q.a)b.classList.add("ok")});
 if(!good)btn.classList.add("bad");fin(good,q);
}
function fin(good,q){
 const by=S.by[q.t]=S.by[q.t]||{ok:0,n:0};by.n++;
 if(!S.retry.has(q)){if(good){S.ok++;by.ok++}else{S.retry.add(q);S.queue.push(q)}}
 const last=S.i===S.queue.length-1;
 const ans=q.type==="order"?`<p><b>Верный порядок:</b> ${q.items.map((x,n)=>`${n+1}. ${esc(x)}`).join("; ")}.</p>`:"";
 document.getElementById("fb").innerHTML=`<div class="fb ${good?"ok":"bad"}"><b>${good?"Верно":"Не совсем"}</b>${ans}<p>${esc(q.e)}</p></div><button class="btn" id="nx">${last?"Смотреть итог":"Дальше"}</button>`;
 document.getElementById("rs")?.remove();
 document.getElementById("nx").onclick=()=>{last?result():(S.i++,show())};
}
function result(){
 const pct=Math.round(S.ok/S.total*100),miss=[...S.retry];send("Вопросы",{pct,ok:S.ok,total:S.total,details:Object.entries(S.by).map(([t,v])=>t+": "+v.ok+"/"+v.n).join("; ")});
 try{const b=+(localStorage.getItem("mg_bestn")||-1);if(pct>b){localStorage.setItem("mg_bestn",pct);localStorage.setItem("mg_best",pct+"% ("+S.ok+" из "+S.total+")")}}catch(e){}
 app.innerHTML=`<h1>${pct}% с первой попытки</h1><p class="mut">${S.ok} из ${S.total} верно сразу. ${miss.length?"Ошибочные вопросы вы уже повторили в конце тренировки.":"Ошибок не было."}</p>
 <h2>По темам</h2><table>${Object.entries(S.by).map(([t,v])=>`<tr><td>${esc(t)}</td><td>${v.ok} из ${v.n}</td></tr>`).join("")}</table>
 ${miss.length?`<h2>Правила, которые стоит перечитать</h2>${miss.map(q=>`<div class="fb"><b>${esc(q.t)}</b><p>${esc(q.e)}</p></div>`).join("")}`:""}
 <div class="row"><button class="btn" id="again">Ещё раз</button><button class="btn ghost" id="hm">К темам</button></div>`;
